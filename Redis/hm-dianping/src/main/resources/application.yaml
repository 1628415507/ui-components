server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123
  # Redis配置
  redis:
    host: 192.168.150.101
    port: 6379
    password: 123321
    lettuce: # lettuce：Spring Data Redis的客户端，用于连接Redis
      pool:
        max-active: 10 # 最大连接数
        max-idle: 10 # 最大空闲连接数
        min-idle: 1 # 最小空闲连接数
        time-between-eviction-runs: 10s
  jackson: # Jackson：JSON处理库，用于将Java对象转换为JSON字符串，或将JSON字符串转换为Java对象
    default-property-inclusion: non_null # JSON处理时忽略非空字段

# MyBatis-Plus配置
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  
# 日志配置
logging:
  level: # 日志级别 
    com.hmdp: debug # 日志级别
  pattern:
    dateformat: mm:ss.SSS # 日志格式